<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-DLC — Style Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400..800;1,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=JetBrains+Mono:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  /* ============ SHARED MOCK STRUCTURE ============ */
  .mock { width: 100%; height: 100%; display: flex; overflow: hidden;
    font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mock .rail { width: 196px; flex: 0 0 196px; display: flex; flex-direction: column;
    border-right: 1px solid; padding: 16px 12px; }
  .mock .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 18px; }
  .mock .brand .mark { width: 24px; height: 24px; border-radius: 7px; flex: 0 0 24px;
    display: flex; align-items: center; justify-content: center; }
  .mock .brand .mark svg { width: 14px; height: 14px; }
  .mock .brand b { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
  .mock .brand span { font-size: 10px; opacity: 0.55; display: block; font-weight: 500; margin-top: 1px; }
  .mock .navsec { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em;
    font-weight: 600; opacity: 0.45; padding: 12px 10px 6px; }
  .mock .nav { display: flex; flex-direction: column; gap: 1px; }
  .mock .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 500; text-decoration: none; cursor: default; }
  .mock .nav a svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .mock .nav a .ic { width: 18px; flex: 0 0 18px; display: flex; align-items: center; justify-content: center; }
  .mock .railfoot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    font-size: 12px; }
  .mock .railfoot .av { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; }

  .mock .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .mock .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 14px;
    padding: 0 22px; border-bottom: 1px solid; }
  .mock .crumb { font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .mock .crumb .sep { opacity: 0.35; }
  .mock .crumb b { font-weight: 650; }
  .mock .topspacer { flex: 1; }
  .mock .btn { font-family: inherit; font-size: 12.5px; font-weight: 600; border-radius: 8px;
    padding: 8px 13px; border: 1px solid transparent; cursor: default; display: inline-flex;
    align-items: center; gap: 7px; }
  .mock .btn svg { width: 13px; height: 13px; }
  .mock .btn-ghost { background: transparent; }

  .mock .work { flex: 1; display: flex; min-height: 0; }
  .mock .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mock .panehd { padding: 16px 22px 10px; display: flex; align-items: baseline; gap: 10px; }
  .mock .panehd h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .mock .panehd .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .mock .panebody { padding: 4px 22px 22px; overflow: hidden; flex: 1; }

  /* requirement text */
  .mock .reqdoc { font-size: 13.5px; line-height: 1.85; }
  .mock .reqdoc p { margin: 0 0 14px; }
  .mock .amb { border-radius: 4px; padding: 1px 3px; font-weight: 500; cursor: default;
    border-bottom: 2px solid; }

  /* question cards */
  .mock .qcard { border: 1px solid; border-radius: 12px; padding: 15px 16px; margin-bottom: 13px; }
  .mock .qcard .qn { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    opacity: 0.5; margin-bottom: 9px; }
  .mock .qcard .qt { font-size: 13.5px; font-weight: 600; line-height: 1.45; margin-bottom: 12px; }
  .mock .opts { display: flex; flex-direction: column; gap: 8px; }
  .mock .opt { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 8px 11px;
    border: 1px solid; border-radius: 9px; }
  .mock .radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid; flex: 0 0 15px;
    display: flex; align-items: center; justify-content: center; }
  .mock .radio .dot { width: 7px; height: 7px; border-radius: 50%; }
  .mock .field { border: 1px solid; border-radius: 9px; padding: 9px 11px; font-size: 12px;
    display: flex; align-items: center; justify-content: space-between; }

  /* notes sidebar */
  .mock .notes { width: 224px; flex: 0 0 224px; border-left: 1px solid; padding: 16px 16px; display: flex;
    flex-direction: column; gap: 12px; }
  .mock .noteshd { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    opacity: 0.5; }
  .mock .note { border-radius: 10px; padding: 11px 12px; font-size: 12px; line-height: 1.5; }
  .mock .note .nm { font-size: 10px; font-weight: 700; opacity: 0.6; margin-bottom: 4px; }
  .mock .ctxbtn { font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px;
    border: 1px dashed; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }

  /* ============ DIRECTION A — WORKBOOK ============ */
  .dirA { background: #faf6f0; color: #2b2722; }
  .dirA .rail { background: #f3ece1; border-color: #e6dccd; }
  .dirA .brand .mark { background: #c6553f; color: #fff; }
  .dirA .brand b { font-family: 'Newsreader', serif; font-size: 17px; font-weight: 500; }
  .dirA .nav a { color: #4a4138; }
  .dirA .nav a.on { background: #fffdf9; color: #c6553f; box-shadow: 0 1px 2px rgba(80,50,20,0.06); font-weight: 650; }
  .dirA .nav a svg { stroke: currentColor; }
  .dirA .railfoot { color: #6b6155; }
  .dirA .railfoot .av { background: #d8c3a8; }
  .dirA .topbar { background: #faf6f0; border-color: #e6dccd; }
  .dirA .crumb { color: #6b6155; }
  .dirA .crumb b { color: #2b2722; }
  .dirA .btn-primary { background: #c6553f; color: #fff; }
  .dirA .btn-ghost { color: #4a4138; border-color: #ddd2c2; }
  .dirA .pane + .pane { border-left: 1px solid #ece3d6; }
  .dirA .panehd h3 { font-family: 'Newsreader', serif; font-weight: 500; font-size: 18px; }
  .dirA .panehd .tag { background: #f0e6d8; color: #8a6a3f; }
  .dirA .reqdoc { color: #4a4138; }
  .dirA .amb { background: #fbe3dc; border-color: #c6553f; color: #9c3e2c; }
  .dirA .qcard { background: #fffdf9; border-color: #ece3d6; box-shadow: 0 1px 3px rgba(80,50,20,0.04); }
  .dirA .qcard .qn { color: #c6553f; opacity: 1; }
  .dirA .opt { border-color: #ece3d6; background: #fbf8f2; }
  .dirA .opt.sel { border-color: #c6553f; background: #fbe9e3; }
  .dirA .radio { border-color: #c2b6a4; }
  .dirA .opt.sel .radio { border-color: #c6553f; }
  .dirA .opt.sel .radio .dot { background: #c6553f; }
  .dirA .field { border-color: #ece3d6; background: #fffdf9; color: #8a8074; }
  .dirA .notes { background: #f3ece1; border-color: #e6dccd; }
  .dirA .noteshd { color: #8a6a3f; }
  .dirA .note { background: #fdf1c9; color: #6a5526; box-shadow: 0 1px 3px rgba(120,90,20,0.1); }
  .dirA .ctxbtn { border-color: #c6553f; color: #c6553f; }

  /* ============ DIRECTION B — STUDIO ============ */
  .dirB { background: #f3f1ec; color: #1f1d1a;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  .dirB .rail { background: #fbfaf7; border-color: #e3e0d8; }
  .dirB .brand .mark { background: #1f1d1a; color: #cdebd8; border-radius: 6px; }
  .dirB .brand b { font-weight: 700; letter-spacing: -0.02em; }
  .dirB .navsec, .dirB .noteshd, .dirB .qcard .qn, .dirB .crumb,
  .dirB .panehd .tag, .dirB .btn { font-family: 'JetBrains Mono', monospace; }
  .dirB .nav a { color: #46443d; border-radius: 6px; }
  .dirB .nav a.on { background: #eef4ef; color: #2f6b46; font-weight: 600; box-shadow: inset 2px 0 0 #3f7d58; border-radius: 6px; }
  .dirB .nav a svg { stroke: currentColor; }
  .dirB .railfoot { color: #6a675e; }
  .dirB .railfoot .av { background: #cdebd8; }
  .dirB .topbar { background: #fbfaf7; border-color: #e3e0d8; }
  .dirB .crumb { color: #6a675e; font-size: 11.5px; }
  .dirB .crumb b { color: #1f1d1a; }
  .dirB .btn { border-radius: 6px; font-size: 11.5px; }
  .dirB .btn-primary { background: #3f7d58; color: #fff; }
  .dirB .btn-ghost { color: #46443d; border-color: #d8d4ca; background: #fff; }
  .dirB .pane + .pane { border-left: 1px solid #e3e0d8; }
  .dirB .panehd h3 { font-weight: 700; letter-spacing: -0.01em; }
  .dirB .panehd .tag { background: #e8e4da; color: #6a675e; border-radius: 4px; font-size: 10px; }
  .dirB .reqdoc { color: #46443d; }
  .dirB .amb { background: #fde8e3; border-color: #c44a32; color: #a23a25; border-radius: 2px; }
  .dirB .qcard { background: #fbfaf7; border-color: #e3e0d8; border-radius: 8px; }
  .dirB .qcard .qn { color: #3f7d58; opacity: 1; font-size: 9.5px; }
  .dirB .opt { border-color: #e3e0d8; background: #fff; border-radius: 6px; }
  .dirB .opt.sel { border-color: #3f7d58; background: #eef4ef; }
  .dirB .radio { border-color: #b8b4aa; border-radius: 3px; }
  .dirB .opt.sel .radio { border-color: #3f7d58; background: #3f7d58; }
  .dirB .opt.sel .radio .dot { background: #fff; width: 6px; height: 6px; border-radius: 1px; }
  .dirB .field { border-color: #e3e0d8; background: #fff; color: #8a8478; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .dirB .notes { background: #fbfaf7; border-color: #e3e0d8; }
  .dirB .noteshd { color: #6a675e; }
  .dirB .note { background: #fffce8; border: 1px solid #f0e8b8; color: #5f5a2a; border-radius: 6px; }
  .dirB .note .nm { font-family: 'JetBrains Mono', monospace; }
  .dirB .ctxbtn { border-color: #3f7d58; color: #3f7d58; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; }

  /* ============ DIRECTION C — CANVAS ============ */
  .dirC { background: #fcf9f2; color: #241f1a;
    font-family: 'Hanken Grotesk', system-ui, sans-serif; }
  .dirC .rail { background: #241f1a; border-color: #241f1a; }
  .dirC .brand .mark { background: #ffd23f; color: #241f1a; border-radius: 9px; }
  .dirC .brand b { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #fcf9f2; font-size: 16px; }
  .dirC .brand span { color: #b8aa92; }
  .dirC .navsec { color: #8a7c66; }
  .dirC .nav a { color: #d8cdb8; border-radius: 10px; }
  .dirC .nav a.on { background: #ffd23f; color: #241f1a; font-weight: 700; }
  .dirC .nav a svg { stroke: currentColor; }
  .dirC .railfoot { color: #b8aa92; }
  .dirC .railfoot .av { background: #6f8f5e; }
  .dirC .topbar { background: #f4584e; border-color: #f4584e; height: 60px; flex-basis: 60px; }
  .dirC .crumb { color: #ffe2df; }
  .dirC .crumb b { color: #fff; }
  .dirC .crumb .sep { color: #ffb3ad; }
  .dirC .btn-primary { background: #241f1a; color: #ffd23f; border-radius: 10px; }
  .dirC .btn-ghost { color: #fff; border-color: rgba(255,255,255,0.4); border-radius: 10px; }
  .dirC .panehd h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
  .dirC .panehd .tag { background: #241f1a; color: #ffd23f; border-radius: 20px; }
  .dirC .pane + .pane { border-left: 1px solid #eee2cd; }
  .dirC .reqdoc { color: #4a4036; }
  .dirC .amb { background: #ffd23f; border-color: #c79400; color: #4a3800; border-radius: 5px; border-bottom-width: 0; }
  .dirC .qcard { background: #fff; border: 2px solid #241f1a; border-radius: 14px;
    box-shadow: 3px 3px 0 #241f1a; }
  .dirC .qcard .qn { color: #f4584e; opacity: 1; font-weight: 800; }
  .dirC .opt { border: 1.5px solid #e0d4be; background: #fcf9f2; border-radius: 10px; }
  .dirC .opt.sel { border-color: #241f1a; background: #fff6d6; }
  .dirC .radio { border-color: #b5a386; }
  .dirC .opt.sel .radio { border-color: #f4584e; }
  .dirC .opt.sel .radio .dot { background: #f4584e; }
  .dirC .field { border: 1.5px solid #e0d4be; background: #fff; color: #8a7e6c; border-radius: 10px; }
  .dirC .notes { background: #6f8f5e; border-color: #6f8f5e; }
  .dirC .noteshd { color: #e6f0df; }
  .dirC .note { background: #fcf9f2; color: #3a4030; border-radius: 10px; }
  .dirC .ctxbtn { border-color: #fff; color: #fff; border-radius: 10px; }

  .legend { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; color: #4a4138; }
  .legend b { display:block; font-family:'Hanken Grotesk',sans-serif; font-size: 13px; color:#2b2722; margin-bottom:4px; }
  .legend .sw { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { useState } = React;

// ---- simple geometric glyphs (squares/circles/lines/checks only) ----
const Icons = {
  clarify: <svg viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3" width="13" height="9" rx="2.5" strokeWidth={1.6}/><path d="M6 15l-1-3" strokeWidth={1.6} strokeLinecap="round"/><circle cx="9" cy="7.5" r="0.9" fill="currentColor"/><circle cx="6" cy="7.5" r="0.9" fill="currentColor"/><circle cx="12" cy="7.5" r="0.9" fill="currentColor"/></svg>,
  stories: <svg viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3" width="13" height="3" rx="1.2" strokeWidth={1.6}/><rect x="2.5" y="7.5" width="9" height="3" rx="1.2" strokeWidth={1.6}/><rect x="2.5" y="12" width="11" height="3" rx="1.2" strokeWidth={1.6}/></svg>,
  arch: <svg viewBox="0 0 18 18" fill="none"><circle cx="4" cy="4.5" r="2.2" strokeWidth={1.6}/><circle cx="14" cy="6.5" r="2.2" strokeWidth={1.6}/><circle cx="8" cy="14" r="2.2" strokeWidth={1.6}/><path d="M5.8 5.6L12 6.2M5.3 6.4l2 5.5M12.5 8.4l-3 4" strokeWidth={1.4}/></svg>,
  infra: <svg viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="12" height="4" rx="1.3" strokeWidth={1.6}/><rect x="3" y="11" width="12" height="4" rx="1.3" strokeWidth={1.6}/><circle cx="6" cy="5" r="0.8" fill="currentColor"/><circle cx="6" cy="13" r="0.8" fill="currentColor"/></svg>,
  tests: <svg viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="12" height="12" rx="2.5" strokeWidth={1.6}/><path d="M6 9.2l2 2 4-4.4" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"/></svg>,
  steer: <svg viewBox="0 0 18 18" fill="none"><path d="M3 5.5h12M3 12.5h12" strokeWidth={1.6} strokeLinecap="round"/><circle cx="7" cy="5.5" r="2.1" fill="currentColor" stroke="none"/><circle cx="11.5" cy="12.5" r="2.1" fill="currentColor" stroke="none"/></svg>,
  mark: <svg viewBox="0 0 18 18" fill="none"><path d="M9 2.5l2 4 4 .2-3 2.7 1 4.1L9 11.5 5 13.5l1-4.1-3-2.7 4-.2z" fill="currentColor" stroke="none"/></svg>,
  copy: <svg viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="8" height="8" rx="1.6" stroke="currentColor" strokeWidth={1.4}/><path d="M5 12h7V5" stroke="currentColor" strokeWidth={1.4} strokeLinecap="round"/></svg>,
  plus: <svg viewBox="0 0 14 14" fill="none"><path d="M7 3v8M3 7h8" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round"/></svg>,
};

const NAV = [
  ['clarify','Clarify'], ['stories','Stories'], ['arch','Architecture'],
  ['infra','Infrastructure'], ['tests','Tests'], ['steer','Steering'],
];

// A full app-shell + Clarification Workspace mock, styled by `dir` class.
function Mock({ dir }) {
  return (
    <div className={"mock " + dir}>
      {/* left rail */}
      <div className="rail">
        <div className="brand">
          <div className="mark">{Icons.mark}</div>
          <div><b>Lifecycle</b><span>billing-service · v3</span></div>
        </div>
        <div className="navsec">Workspaces</div>
        <div className="nav">
          {NAV.map(([k,label],i)=>(
            <a key={k} className={i===0?'on':''}>
              <span className="ic">{Icons[k]}</span>{label}
            </a>
          ))}
        </div>
        <div className="railfoot">
          <div className="av"></div>
          <div>Priya R.</div>
        </div>
      </div>

      {/* main */}
      <div className="main">
        <div className="topbar">
          <div className="crumb"><span>billing-service</span><span className="sep">/</span><b>Clarification</b></div>
          <div className="topspacer"></div>
          <button className="btn btn-ghost">Re-run analysis</button>
          <button className="btn btn-primary">{Icons.copy} copy to json</button>
        </div>

        <div className="work">
          {/* requirement pane */}
          <div className="pane">
            <div className="panehd"><h3>Original requirement</h3><span className="tag">3 ambiguities</span></div>
            <div className="panebody">
              <div className="reqdoc">
                <p>Build a usage-based billing service that charges customers
                  <span className="amb"> at the end of each cycle</span>. Customers
                  should be able to view invoices and update payment methods.</p>
                <p>When a payment <span className="amb">fails</span>, the system retries and
                  notifies the customer. Usage events arrive from
                  <span className="amb"> multiple upstream services</span> and must be
                  aggregated accurately.</p>
              </div>
            </div>
          </div>

          {/* questions pane */}
          <div className="pane">
            <div className="panehd"><h3>AI clarifications</h3><span className="tag">2 of 5 answered</span></div>
            <div className="panebody">
              <div className="qcard">
                <div className="qn">Q3 · Billing cadence</div>
                <div className="qt">What defines “the end of each cycle”?</div>
                <div className="opts">
                  <div className="opt sel"><span className="radio"><span className="dot"></span></span>Calendar month (UTC)</div>
                  <div className="opt"><span className="radio"></span>Per-customer anniversary date</div>
                </div>
              </div>
              <div className="qcard">
                <div className="qn">Q4 · Failed payments</div>
                <div className="qt">How many retries before dunning?</div>
                <div className="field"><span>e.g. 3 retries over 7 days…</span><span style={{opacity:.5}}>↵</span></div>
                <div style={{marginTop:10}}><span className="ctxbtn">{Icons.plus} suggested context</span></div>
              </div>
            </div>
          </div>

          {/* notes sidebar */}
          <div className="notes">
            <div className="noteshd">Global notes</div>
            <div className="note">
              <div className="nm">CONSTRAINT</div>
              All money math in integer cents. No floats anywhere.
            </div>
            <div className="note">
              <div className="nm">PRIYA · 2h</div>
              Default currency is USD until multi-currency epic lands.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="dirs" title="AI-DLC · Visual Directions" subtitle="App shell + Clarification Workspace shown in three warm, 37signals-flavored styles. Pick one — or mix elements across them.">
        <DCArtboard id="a" label="A · Workbook — paper, ink & clay" width={1240} height={560}>
          <Mock dir="dirA" />
        </DCArtboard>
        <DCArtboard id="b" label="B · Studio — warm gray, mono labels, forest green" width={1240} height={560}>
          <Mock dir="dirB" />
        </DCArtboard>
        <DCArtboard id="c" label="C · Canvas — bold color blocks, chunky type" width={1240} height={560}>
          <Mock dir="dirC" />
        </DCArtboard>
      </DCSection>

      <DCSection id="notes-sec" title="Notes" subtitle="How these differ, and what ships with whichever you pick.">

          <div className="legend" style={{padding:'26px 28px', background:'#fffdf9', height:'100%'}}>

            <p style={{marginTop:0}}><span className="sw" style={{background:'#c6553f'}}></span><b style={{display:'inline',fontSize:12}}>A · Workbook</b> — Editorial. Newsreader serif headings, single clay accent, soft paper. Calm &amp; literary; reads like a well-set document.</p>
